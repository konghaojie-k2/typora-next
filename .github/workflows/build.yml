name: Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      # One platform failing must not cancel the others.
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          # macos-13 runners are retired; macos-15-intel is the Intel image.
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Restore cached dependencies
        uses: Swatinem/rust-cache@v2

      # Prebuilt tauri-cli binary (much faster than cargo install).
      - name: Install Tauri CLI
        uses: taiki-e/install-action@v2
        with:
          tool: tauri-cli@2.11.1

      - name: Build & bundle
        shell: bash
        run: |
          cd src-tauri
          cargo tauri build --target ${{ matrix.target }}

      # Universal dmg: built once on the Apple Silicon runner (needs both targets).
      - name: Create Universal macOS binary
        if: matrix.target == 'aarch64-apple-darwin'
        shell: bash
        run: |
          rustup target add x86_64-apple-darwin
          cd src-tauri
          cargo tauri build --target universal-apple-darwin

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: typora-next-${{ matrix.target }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/
            src-tauri/target/universal-apple-darwin/release/bundle/
          if-no-files-found: warn
