name: Release

on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Restore cached dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install Tauri CLI
        uses: taiki-e/install-action@v2
        with:
          tool: tauri-cli@2

      - name: Build & bundle (signed)
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          cd src-tauri
          cargo tauri build --target ${{ matrix.target }}

      - name: Create Universal macOS binary
        if: matrix.target == 'aarch64-apple-darwin'
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          rustup target add x86_64-apple-darwin
          cd src-tauri
          cargo tauri build --target universal-apple-darwin

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: typora-next-${{ matrix.target }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/
            src-tauri/target/universal-apple-darwin/release/bundle/
          if-no-files-found: warn

  create-release:
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Determine version and release type
        id: version
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "prerelease=false" >> $GITHUB_OUTPUT
          else
            DATE=$(date +%Y%m%d)
            SHA=${GITHUB_SHA:0:7}
            echo "tag=nightly-${DATE}-${SHA}" >> $GITHUB_OUTPUT
            echo "prerelease=true" >> $GITHUB_OUTPUT
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate latest.json manifest
        shell: bash
        run: |
          set -euo pipefail

          # Extract app version from tauri.conf.json
          VERSION=$(grep '"version"' src-tauri/tauri.conf.json | head -1 | sed 's/.*: "\([^"]*\)".*/\1/')
          echo "App version: $VERSION"
          TAG=${{ steps.version.outputs.tag }}
          REPO="${{ github.repository }}"

          # Build platforms JSON using jq
          PLATFORMS='{}'

          # Walk all bundle directories in downloaded artifacts
          for artifact_dir in artifacts/*/; do
            [ -d "$artifact_dir" ] || continue

            # Determine platform key from directory name
            dir_name=$(basename "$artifact_dir")
            platform=""
            # mac 更新器统一走 universal 包：单架构 .app.tar.gz 与 universal 同名
            # （TyporaNext.app.tar.gz），同名资产上传到 release 只存活一个，
            # 各架构自己的签名对不上存活文件 → 验签必败。universal 一个文件对
            # 两种芯片都合法，darwin-x86_64 / darwin-aarch64 都指向它。
            # universal 包在 aarch64 job 的 artifact 里（target/universal-apple-darwin/）。
            case "$dir_name" in
              *x86_64-pc-windows-msvc*)   platform="windows-x86_64" ;;
              *aarch64-apple-darwin*)     platform="darwin" ;;
              *x86_64-apple-darwin*)      platform="" ;;  # x64 dmg 仍上传供手动下载，更新不走它
            esac
            [ -z "$platform" ] && continue

            # Find installer file (prefer .exe for Windows, universal .tar.gz for macOS)
            installer=""
            if [[ "$platform" == windows-* ]]; then
              installer=$(find "$artifact_dir" -name "*.exe" ! -name "*.exe.sig" 2>/dev/null | head -1)
              # Fallback to .msi if no .exe
              if [ -z "$installer" ]; then
                installer=$(find "$artifact_dir" -name "*.msi" ! -name "*.msi.sig" 2>/dev/null | head -1)
              fi
            else
              installer=$(find "$artifact_dir" -path "*universal-apple-darwin*" -name "*.tar.gz" 2>/dev/null | head -1)
              # 更新器只吃 .app.tar.gz；universal 缺失是发布事故，直接失败而非静默跳过
              if [ -z "$installer" ]; then
                echo "Error: universal updater bundle (.app.tar.gz) not found in $dir_name"
                exit 1
              fi
            fi

            if [ -z "$installer" ]; then
              echo "Warning: No installer found for $platform ($dir_name)"
              continue
            fi

            # Find corresponding .sig file
            sig_file="${installer}.sig"
            if [ ! -f "$sig_file" ]; then
              echo "Warning: No .sig file found for $installer"
              continue
            fi

            sig_content=$(cat "$sig_file")
            installer_name=$(basename "$installer")
            url="https://github.com/${REPO}/releases/download/${TAG}/${installer_name}"

            echo "  $platform → $installer_name"

            # Add to platforms JSON（darwin 一次写两个架构键，url/签名同为 universal）
            if [[ "$platform" == "darwin" ]]; then
              PLATFORMS=$(echo "$PLATFORMS" | jq \
                --arg u "$url" \
                --arg s "$sig_content" \
                '. + {"darwin-x86_64": {"signature": $s, "url": $u}, "darwin-aarch64": {"signature": $s, "url": $u}}')
            else
              PLATFORMS=$(echo "$PLATFORMS" | jq \
                --arg p "$platform" \
                --arg u "$url" \
                --arg s "$sig_content" \
                '. + {($p): {"signature": $s, "url": $u}}')
            fi
          done

          # Write latest.json
          PUB_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          cat > latest.json << EOF
          {
            "version": "${VERSION}",
            "notes": "",
            "pub_date": "${PUB_DATE}",
            "platforms": ${PLATFORMS}
          }
          EOF

          echo ""
          echo "=== latest.json ==="
          cat latest.json

      - name: Drop non-universal macOS updater bundles
        shell: bash
        run: |
          # 三个 mac 构建的 .app.tar.gz 同名（TyporaNext.app.tar.gz），同名资产并发上传
          # 互踩 404（v0.4.8 曾因此丢 sig）。latest.json 已统一指向 universal，
          # 其余同名文件直接删掉，只保留 universal 的 tar.gz + sig。
          find artifacts -type f \( -name "*.app.tar.gz" -o -name "*.app.tar.gz.sig" \) \
            ! -path "*universal-apple-darwin*" -print -delete

      - name: Create/Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          body_path: CHANGELOG.md
          draft: false
          prerelease: ${{ steps.version.outputs.prerelease }}
          fail_on_unmatched_files: false
          files: |
            artifacts/**/*.msi
            artifacts/**/*.exe
            artifacts/**/*.dmg
            artifacts/**/*.tar.gz
            artifacts/**/*.deb
            artifacts/**/*.AppImage
            artifacts/**/*.sig
            latest.json
