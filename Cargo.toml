[package]
name = "typora-next"
version = "0.1.0"
edition = "2021"
description = "A WYSIWYG markdown editor with extended syntax support"
license = "MIT"

[dependencies]
pulldown-cmark = "0.12"     # CommonMark parsing
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"           # Error handling

# Optional: WebView (uncomment when ready for GUI)
# tauri = { version = "2.0", features = ["devtools"] }
# or wry for simpler WebView

[dev-dependencies]
pretty_assertions = "1.4"

[profile.release]
opt-level = 3
lto = true