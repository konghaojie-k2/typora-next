<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Typora Next</title>
  <!-- KaTeX for math rendering (local) -->
  <link rel="stylesheet" href="vendor/katex/katex.min.css">
  <!-- Prism.js for code highlighting (local) -->
  <link href="vendor/prism/prism-tomorrow.min.css" rel="stylesheet">
  <!-- Main styles -->
  <link rel="stylesheet" href="styles/main.css">
</head>
<body>
  <div class="app-container">
    <!-- File Tree Sidebar -->
    <aside class="file-tree-sidebar" id="fileTreeSidebar">
      <div class="file-tree-header">
        <h3>文件</h3>
        <button class="file-tree-toggle" id="fileTreeToggle" title="Toggle File Tree">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 12h18M3 6h18M3 18h18"/>
          </svg>
        </button>
      </div>
      <div class="file-tree-toolbar">
        <button class="file-tree-btn" id="openFolderBtn" title="Open Folder (Ctrl+Shift+O)">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
          </svg>
          打开文件夹
        </button>
      </div>
      <div class="file-tree-search">
        <input type="text" id="fileTreeSearch" placeholder="搜索文件...">
      </div>
      <nav class="file-tree" id="fileTree">
        <p class="file-tree-empty">打开文件夹以显示文件树</p>
      </nav>
    </aside>

    <!-- TOC Sidebar -->
    <aside class="toc-sidebar" id="tocSidebar">
      <div class="toc-header">
        <h3>目录</h3>
        <button class="toc-toggle" id="tocToggle" title="Toggle TOC">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 12h18M3 6h18M3 18h18"/>
          </svg>
        </button>
      </div>
      <nav class="toc-tree" id="tocTree">
        <p class="toc-empty">打开文件以显示目录</p>
      </nav>
    </aside>

    <!-- Main Content Area -->
    <main class="content-area" id="contentArea">
      <!-- Toolbar -->
      <header class="toolbar">
        <div class="toolbar-left">
          <button class="btn-icon" id="openFileBtn" title="Open File (Ctrl+O)">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/>
              <polyline points="13 2 13 9 20 9"/>
            </svg>
          </button>
          <button class="btn-icon" id="openFolderToolbarBtn" title="Open Folder (Ctrl+Shift+O)">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
            </svg>
          </button>
        </div>
        <div class="toolbar-right">
          <button class="btn-icon" id="exportPdfBtn" title="导出 PDF (Ctrl+P)">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
              <polyline points="7 10 12 15 17 10"/>
              <line x1="12" y1="15" x2="12" y2="3"/>
            </svg>
          </button>
          <button class="btn-toggle" id="sourceToggle">
            <span class="toggle-label">源码</span>
            <span class="toggle-hint">(Ctrl+E)</span>
          </button>
        </div>
      </header>

      <!-- Tabs Bar -->
      <div class="tabs-bar" id="tabsBar">
        <div class="tabs-list" id="tabsList"></div>
      </div>

      <!-- Markdown Content -->
      <article class="markdown-body" id="markdownBody">
        <div class="welcome-message">
          <h1>Typora Next</h1>
          <p>一个现代化的 Markdown 编辑器</p>
          <p>按 <kbd>Ctrl+O</kbd> 打开文件，或拖拽文件到此处</p>
        </div>
      </article>

      <!-- Source Code View (hidden by default) -->
      <div class="source-view" id="sourceView" style="display: none;">
        <pre class="source-code" id="sourceCode"></pre>
      </div>
    </main>
  </div>

  <!-- Scripts (local vendor) -->
  <script src="vendor/katex/katex.min.js"></script>
  <script src="vendor/katex/auto-render.min.js"></script>
  <script src="vendor/prism/prism.min.js"></script>
  <script src="vendor/prism/prism-autoloader.min.js" data-autoloader-path="vendor/prism/"></script>
  <script src="vendor/mermaid/mermaid.min.js"></script>
  <script src="scripts/main.js"></script>
</body>
</html>
