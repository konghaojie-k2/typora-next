<svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
  </defs>

  <!-- 暖白圆角背景 -->
  <rect width="1024" height="1024" rx="228" fill="url(#bg-grad)"/>

  <!-- 打开的书本：黑色，弧度更大 -->
  <g fill="#0f172a" opacity="0.95">
    <!-- 左页 -->
    <path d="M180 800 Q320 720 512 760 L512 832 Q340 792 180 832 Z"/>
    <!-- 右页 -->
    <path d="M512 760 Q704 720 844 800 L844 832 Q684 792 512 832 Z"/>
    <!-- 书脊 -->
    <path d="M504 760 L520 760 L520 836 L504 836 Z" fill="#0f172a" opacity="0.6"/>
  </g>

  <!-- 书本页边曲线 -->
  <path d="M180 800 Q320 720 512 760" fill="none" stroke="#0f172a" stroke-width="8" stroke-linecap="round" opacity="0.8"/>
  <path d="M512 760 Q704 720 844 800" fill="none" stroke="#0f172a" stroke-width="8" stroke-linecap="round" opacity="0.8"/>

  <!-- 黑色 M 字母 -->
  <path d="M320 620 L380 320 L512 500 L644 320 L704 620"
        fill="none" stroke="#0f172a" stroke-width="52" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- M 高光 -->
  <path d="M360 560 L380 440" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" opacity="0.2"/>
</svg>
