[workspace]
members = [".", "crates/docx-export"]

[package]
name = "app"
version = "0.2.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.0", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.0", features = ["devtools", "protocol-asset"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-single-instance = "2"

# Core markdown processing
pulldown-cmark = "0.12"
regex = "1"
thiserror = "2.0"

# File watching
notify = "8"

# HTTP client for AI API
ureq = { version = "2", features = ["json"] }

# Date/time handling
chrono = "0.4"

# ZIP archive for sharing documents
zip = "2"
walkdir = "2"

# Base64 encoding for file downloads
base64 = "0.22"

# Async oneshot channel for bridging callback-based dialogs
tokio = { version = "1", features = ["sync", "time"] }

# DOCX export with native OMML math equations
docx-export = { path = "crates/docx-export" }

# SVG rasterization for Mermaid diagrams in Word export
resvg = "0.44"
usvg = "0.44"
fontdb = "0.22"
tiny-skia = { version = "0.11", features = ["png"] }

# Auto-update via GitHub Releases
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

# macOS 原生 PDF 导出（NSPrintOperation 系统打印面板，issue #4/#5）
# 版本需与 Cargo.lock 中 wry 0.55 传递依赖保持一致
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-web-kit = { version = "0.3", features = ["WKWebView"] }
objc2-app-kit = { version = "0.3", features = ["NSPrintOperation", "NSView"] }
